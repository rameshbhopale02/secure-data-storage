<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Download</title>
    <link rel="stylesheet" href="/static/css/download.css">
</head>
<body>
    <div class="file">
        <h1 class="services-title">Download Your Data!</h1>
        <button id="btn">
            
            <a href="{{ url_for('static', filename=variable + '.zip') }}" download="{{ variable }}.zip">
                Click here to Download 
            </a>
        </button>
    </div>
</body>
</html>
